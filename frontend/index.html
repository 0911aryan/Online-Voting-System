<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Online Voting System</title>
    <!-- Bonus: Chart.js library for the live bar chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; color: #333; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background-color: #004494; }
        .post-section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; background: #fafafa; border-radius: 5px; }
        #audit-log { font-family: monospace; font-size: 13px; text-align: left; background: #222; color: #0f0; padding: 15px; border-radius: 5px; height: 150px; overflow-y: auto; margin-top: 20px;}
    </style>
</head>
<body>
    <div class="container" id="login-screen">
        <h2>Advanced Voter Authentication</h2>
        <p>Enter your ID and Name to access the ballot.</p>
        <input type="text" id="voter-id" placeholder="Voter ID (e.g., V101)">
        <input type="text" id="voter-name" placeholder="Full Name (e.g., Student One)">
        <br>
        <button onclick="login()">Authenticate & Enter</button>
        <p id="login-error" style="color: red; font-weight: bold;"></p>
    </div>

    <div class="container" id="ballot-screen" style="display:none;">
        <h2>Official Ballot</h2>
        <p id="vote-msg" style="font-weight: bold;"></p>
        <div id="candidate-list"></div>
        <hr>
        <button onclick="showResults()" style="background-color: #28a745;">Admin: View Live Results & Audit Log</button>
    </div>

    <div class="container" id="results-screen" style="display:none;">
        <h2>Live Election Results</h2>
        <canvas id="resultsChart"></canvas>
        
        <h3 style="margin-top: 30px;">System Audit Log</h3>
        <div id="audit-log"></div>
        <br>
        <button onclick="location.reload()">End Session & Return Home</button>
    </div>

    <script>
        const API_URL = "http://localhost:8080/api";
        let currentVoterId = "";

        function login() {
            const id = document.getElementById('voter-id').value.trim();
            const name = document.getElementById('voter-name').value.trim();
            
            fetch(`${API_URL}/auth?voterId=${id}&name=${encodeURIComponent(name)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.message === "Success") {
                        currentVoterId = id;
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('ballot-screen').style.display = 'block';
                        loadBallot();
                    } else {
                        document.getElementById('login-error').innerText = data.message;
                    }
                });
        }

        function loadBallot() {
            fetch(API_URL + "/candidates")
                .then(res => res.json())
                .then(candidates => {
                    const list = document.getElementById('candidate-list');
                    list.innerHTML = ""; 
                    
                    // Group candidates by their specific election post
                    const posts = [...new Set(candidates.map(c => c.post))];
                    
                    posts.forEach(post => {
                        let postHtml = `<div class="post-section"><h3>Race: ${post}</h3>`;
                        candidates.filter(c => c.post === post).forEach(c => {
                            postHtml += `<button onclick="submitVote(${c.id})">Vote for ${c.name}</button> `;
                        });
                        postHtml += `</div>`;
                        list.innerHTML += postHtml;
                    });
                });
        }

        function submitVote(candidateId) {
            fetch(`${API_URL}/vote?voterId=${currentVoterId}&candidateId=${candidateId}`)
                .then(res => res.json())
                .then(data => {
                    const msg = document.getElementById('vote-msg');
                    msg.innerText = data.message;
                    msg.style.color = data.message.startsWith("Success") ? "green" : "red";
                });
        }

        function showResults() {
            document.getElementById('ballot-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';

            // Generate the live Chart.js Bar Chart
            fetch(API_URL + "/candidates")
                .then(res => res.json())
                .then(candidates => {
                    const ctx = document.getElementById('resultsChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: candidates.map(c => c.name + ' (' + c.post + ')'),
                            datasets: [{
                                label: 'Total Votes Cast',
                                data: candidates.map(c => c.votes),
                                backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545']
                            }]
                        },
                        options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                    });
                });

            // Fetch and render the anonymous audit log
            fetch(API_URL + "/audit")
                .then(res => res.json())
                .then(logs => {
                    const logDiv = document.getElementById('audit-log');
                    logDiv.innerHTML = logs.length === 0 ? "<div>No votes recorded yet.</div>" : 
                                       logs.map(log => `<div>> ${log}</div>`).join("");
                });
        }
    </script>
</body>
</html>
