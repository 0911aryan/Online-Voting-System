<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; text-align: center; margin-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input[type="text"] { width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #004494; }
        #message { margin-top: 20px; font-weight: bold; }
        .candidate-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; background: #fafafa; }
    </style>
</head>
<body>

    <div class="container" id="login-screen">
        <h2>Student Voting Portal</h2>
        <p>Please enter your unique Voter ID to continue.</p>
        <input type="text" id="voter-id" placeholder="e.g., V101 or V102">
        <br>
        <button onclick="login()">Access Ballot</button>
    </div>

    <div class="container" id="ballot-screen" style="display:none;">
        <h2>Cast Your Vote</h2>
        <p>Select a candidate below. You may only vote once.</p>
        <div id="candidate-list">Loading candidates...</div>
        <p id="message"></p>
        <hr>
        <button onclick="showResults()" style="background-color: #28a745;">View Live Results</button>
    </div>

    <div class="container" id="results-screen" style="display:none;">
        <h2>Live Election Results</h2>
        <div id="results-list"></div>
        <br>
        <button onclick="location.reload()">Back to Login</button>
    </div>

    <script>
        // Points to your running Java HttpServer
        const API_URL = "http://localhost:8080/api";
        let currentVoterId = "";

        function login() {
            const input = document.getElementById('voter-id').value.trim();
            if (input === "") {
                alert("Voter ID cannot be empty.");
                return;
            }
            currentVoterId = input;
            
            // Hide login, show ballot
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ballot-screen').style.display = 'block';
            fetchCandidatesForBallot();
        }

        function fetchCandidatesForBallot() {
            fetch(API_URL + "/candidates")
                .then(response => response.json())
                .then(candidates => {
                    const list = document.getElementById('candidate-list');
                    list.innerHTML = ""; 
                    
                    candidates.forEach(candidate => {
                        const div = document.createElement('div');
                        div.className = "candidate-card";
                        div.innerHTML = `
                            <strong>${candidate.name}</strong><br>
                            <button onclick="submitVote(${candidate.id})">Vote for ${candidate.name}</button>
                        `;
                        list.appendChild(div);
                    });
                })
                .catch(err => console.error("Error fetching candidates:", err));
        }

        function submitVote(candidateId) {
            fetch(`${API_URL}/vote?voterId=${currentVoterId}&candidateId=${candidateId}`)
                .then(response => response.json())
                .then(data => {
                    const msgElement = document.getElementById('message');
                    msgElement.innerText = data.message;
                    
                    // Change color based on success or error
                    if(data.message.startsWith("Success")) {
                        msgElement.style.color = "green";
                    } else {
                        msgElement.style.color = "red";
                    }
                })
                .catch(err => console.error("Error submitting vote:", err));
        }

        function showResults() {
            document.getElementById('ballot-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';

            fetch(API_URL + "/candidates")
                .then(response => response.json())
                .then(candidates => {
                    const list = document.getElementById('results-list');
                    list.innerHTML = "";
                    
                    candidates.forEach(candidate => {
                        list.innerHTML += `
                            <div class="candidate-card">
                                <strong>${candidate.name}</strong>: ${candidate.votes} votes
                            </div>
                        `;
                    });
                });
        }
    </script>
</body>
</html>
